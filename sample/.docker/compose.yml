services:
  apache-php:
    image: takeshitawork/web-server-php:apache-php${PHP_VERSION}
    ports:
      - 80:80
      - 443:443
    volumes:
      - "${APP_DIR}:/var/www"
    depends_on:
      - db

  db:
    image: takeshitawork/web-server-php:${DB_ENGINE}${DB_VERSION}
    volumes:
      - db:/var/lib/mysql

  phpmyadmin:
    image: takeshitawork/web-server-php:phpmyadmin
    environment:
      - PMA_HOST=db
    ports:
      - 8080:80
    volumes:
      - pma:/sessions

  smtp:
    image: takeshitawork/web-server-php:mailcatcher
    ports:
    - "1080:1080"

volumes:
  db:
    driver: 'local'
  pma:
    driver: 'local'