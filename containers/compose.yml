  ##############################
  # mysql
  ##############################
  mysql5.7:
    image: takeshitawork/web-server-php:mysql5.7

  mysql8.0:
    image: takeshitawork/web-server-php:mysql8.0

  mysql8.4:
    image: takeshitawork/web-server-php:mysql8.4

  ##############################
  # mariadb
  ##############################
  mariadb10.6:
    image: takeshitawork/web-server-php:mariadb10.6

  mariadb10.11:
    image: takeshitawork/web-server-php:mariadb10.11

  mariadb11.4:
    image: takeshitawork/web-server-php:mariadb11.4

  ##############################
  # phpMyAdmin
  ##############################
  phpmyadmin-mysql5.7:
    image: takeshitawork/web-server-php:phpmyadmin
    environment:
      - PMA_HOST=mysql5.7
    ports:
      - 30080:80

  phpmyadmin-mysql8.0:
    image: takeshitawork/web-server-php:phpmyadmin
    environment:
      - PMA_HOST=mysql8.0
    ports:
      - 31080:80

  phpmyadmin-mysql8.4:
    image: takeshitawork/web-server-php:phpmyadmin
    environment:
      - PMA_HOST=mysql8.4
    ports:
      - 32080:80

  phpmyadmin-mariadb10.6:
    image: takeshitawork/web-server-php:phpmyadmin
    environment:
      - PMA_HOST=mariadb10.6
    ports:
      - 33080:80

  phpmyadmin-mariadb10.11:
    image: takeshitawork/web-server-php:phpmyadmin
    environment:
      - PMA_HOST=mariadb10.11
    ports:
      - 34080:80

  phpmyadmin-mariadb11.4:
    image: takeshitawork/web-server-php:phpmyadmin
    environment:
      - PMA_HOST=mariadb11.4
    ports:
      - 35080:80

  ##############################
  # mailcatcher_latest
  ##############################
  smtp:
    image: takeshitawork/web-server-php:mailcatcher
    ports:
      - 1080:1080
