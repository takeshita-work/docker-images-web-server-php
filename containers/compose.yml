  #   ports:
  #     - 10080:80
  #     - 10443:443
  #   volumes:
  #     - ./app:/var/www

  apache-php5.5:
    image: takeshitawork/web-server-php:apache-php5.5
    ports:
      - 11080:80
      - 11443:443
    volumes:
      - ./app:/var/www

